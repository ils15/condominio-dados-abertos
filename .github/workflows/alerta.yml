name: Informe semanal (e-mail + WhatsApp)

# Toda segunda-feira às 09h (Brasília) envia à síndica o resumo do que vence.
# Canais independentes — configure um ou ambos em Settings → Secrets → Actions:
#   E-mail:    ALERTA_SMTP_HOST, ALERTA_SMTP_PORT, ALERTA_SMTP_USER, ALERTA_SMTP_PASS,
#              ALERTA_EMAIL_DE, ALERTA_EMAIL_PARA
#   WhatsApp:  ALERTA_WHATS_PHONE (+55DDN...), ALERTA_WHATS_APIKEY (callmebot.com/start.php)
# Sem secrets, roda em modo teste e não envia nada.
on:
  schedule:
    - cron: '0 12 * * 1' # 12:00 UTC = 09:00 BRT
  workflow_dispatch:

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar dados
        run: python3 scripts/gerar_dados.py --perfil publico

      - name: Enviar informe
        env:
          ALERTA_SMTP_HOST: ${{ secrets.ALERTA_SMTP_HOST }}
          ALERTA_SMTP_PORT: ${{ secrets.ALERTA_SMTP_PORT }}
          ALERTA_SMTP_USER: ${{ secrets.ALERTA_SMTP_USER }}
          ALERTA_SMTP_PASS: ${{ secrets.ALERTA_SMTP_PASS }}
          ALERTA_EMAIL_DE: ${{ secrets.ALERTA_EMAIL_DE }}
          ALERTA_EMAIL_PARA: ${{ secrets.ALERTA_EMAIL_PARA }}
          ALERTA_WHATS_PHONE: ${{ secrets.ALERTA_WHATS_PHONE }}
          ALERTA_WHATS_APIKEY: ${{ secrets.ALERTA_WHATS_APIKEY }}
        run: python3 scripts/alerta.py
